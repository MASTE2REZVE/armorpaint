name: Build ArmorPaint Android

on:
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout ArmorPaint
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK components
        run: |
          set -euxo pipefail

          sdkmanager --install \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            "ndk;29.0.14206865" \
            "cmake;4.0.2"

          yes | sdkmanager --licenses || true

      - name: Patch Android template path
        working-directory: paint
        run: |
          set -euxo pipefail

          echo "============================================================"
          echo "PATCHING make.js"
          echo "============================================================"

          FILE="../base/make.js"

          grep -n "function get_text_data" "$FILE" || true
          grep -n "function get_binary_data" "$FILE" || true

          sed -i \
            's#irondir + "/sources/backends/data/#makedir + "/sources/backends/data/#g' \
            "$FILE"

          echo
          echo "After patch:"
          grep -n "sources/backends/data" "$FILE" | head -20 || true

      - name: Generate Android project
        working-directory: paint
        run: |
          set -euxo pipefail

          echo "============================================================"
          echo "GENERATING ANDROID PROJECT"
          echo "============================================================"

          ../base/make --target android

          echo
          echo "Generation finished."

      - name: Repair Gradle Wrapper
        working-directory: paint/build/ArmorPaint
        run: |
          set -euxo pipefail

          echo "============================================================"
          echo "REPAIRING GRADLE WRAPPER"
          echo "============================================================"

          TEMPLATE="../../../base/sources/backends/data/android"

          echo "Generated project:"
          pwd

          echo
          echo "Wrapper files before repair:"
          find gradle -maxdepth 3 -type f -print 2>/dev/null || true
          ls -l gradlew gradlew.bat 2>/dev/null || true

          echo
          echo "Copying official wrapper files..."

          mkdir -p gradle/wrapper

          cp "$TEMPLATE/gradlew" gradlew
          cp "$TEMPLATE/gradlew.bat" gradlew.bat
          cp "$TEMPLATE/gradle/wrapper/gradle-wrapper.jar" \
            gradle/wrapper/gradle-wrapper.jar
          cp "$TEMPLATE/gradle/wrapper/gradle-wrapper.properties" \
            gradle/wrapper/gradle-wrapper.properties

          chmod +x gradlew

          echo
          echo "Wrapper files after repair:"
          ls -lh gradlew gradlew.bat
          ls -lh gradle/wrapper/

      - name: Inspect Generated Android Project
        working-directory: paint/build/ArmorPaint
        run: |
          set +e

          echo
          echo "============================================================"
          echo "ARMORPAINT ANDROID PROJECT DIAGNOSTIC"
          echo "============================================================"

          echo
          echo "PROJECT DIRECTORY:"
          pwd

          echo
          echo "============================================================"
          echo "ROOT DIRECTORY FILES"
          echo "============================================================"

          find . -maxdepth 2 -type f \
            -printf '%p (%s bytes)\n' \
            | sort

          echo
          echo "============================================================"
          echo "ROOT DIRECTORY FOLDERS"
          echo "============================================================"

          find . -maxdepth 2 -type d -print | sort

          echo
          echo "============================================================"
          echo "build.gradle.kts"
          echo "============================================================"

          if [ -f build.gradle.kts ]; then
            echo "SIZE:"
            wc -c build.gradle.kts
            echo
            echo "CONTENT:"
            nl -ba build.gradle.kts
          else
            echo "MISSING: build.gradle.kts"
          fi

          echo
          echo "============================================================"
          echo "settings.gradle.kts"
          echo "============================================================"

          if [ -f settings.gradle.kts ]; then
            echo "SIZE:"
            wc -c settings.gradle.kts
            echo
            echo "CONTENT:"
            nl -ba settings.gradle.kts
          else
            echo "MISSING: settings.gradle.kts"
          fi

          echo
          echo "============================================================"
          echo "settings.gradle"
          echo "============================================================"

          if [ -f settings.gradle ]; then
            echo "SIZE:"
            wc -c settings.gradle
            echo
            echo "CONTENT:"
            nl -ba settings.gradle
          else
            echo "MISSING: settings.gradle"
          fi

          echo
          echo "============================================================"
          echo "gradle.properties"
          echo "============================================================"

          if [ -f gradle.properties ]; then
            echo "SIZE:"
            wc -c gradle.properties
            echo
            echo "CONTENT:"
            nl -ba gradle.properties
          else
            echo "MISSING: gradle.properties"
          fi

          echo
          echo "============================================================"
          echo "ANDROID MANIFEST / GRADLE FILES"
          echo "============================================================"

          find . -type f \( \
            -name "AndroidManifest.xml" -o \
            -name "*.gradle" -o \
            -name "*.gradle.kts" \
          \) -printf '%p (%s bytes)\n' \
            | sort

          echo
          echo "============================================================"
          echo "GENERATOR TEMPLATE FILE SIZES"
          echo "============================================================"

          TEMPLATE="../../../base/sources/backends/data/android"

          for f in \
            build.gradle.kts \
            gradle.properties \
            settings.gradle.kts \
            settings.gradle \
            gradlew \
            gradlew.bat \
            gradle/wrapper/gradle-wrapper.jar \
            gradle/wrapper/gradle-wrapper.properties
          do
            if [ -f "$TEMPLATE/$f" ]; then
              printf "%-50s " "$f"
              wc -c < "$TEMPLATE/$f"
            else
              echo "MISSING TEMPLATE: $f"
            fi
          done

          echo
          echo "============================================================"
          echo "GENERATED FILE SIZES"
          echo "============================================================"

          for f in \
            build.gradle.kts \
            gradle.properties \
            settings.gradle.kts \
            settings.gradle \
            gradlew \
            gradlew.bat \
            gradle/wrapper/gradle-wrapper.jar \
            gradle/wrapper/gradle-wrapper.properties
          do
            if [ -f "$f" ]; then
              printf "%-50s " "$f"
              wc -c < "$f"
            else
              echo "MISSING GENERATED: $f"
            fi
          done

          echo
          echo "============================================================"
          echo "ANDROID EXPORTER SECTION FROM make.js"
          echo "============================================================"

          grep -n -A45 -B10 \
            "class AndroidExporter" \
            ../../../base/make.js \
            | head -100

          echo
          echo "============================================================"
          echo "IMPORTANT GRADLE REFERENCES"
          echo "============================================================"

          grep -RniE \
            "com.android|android.application|android.library|include\\(|pluginManagement|rootProject" \
            . \
            --include="*.gradle" \
            --include="*.gradle.kts" \
            --include="settings.gradle" \
            --include="settings.gradle.kts" \
            2>/dev/null \
            | head -100

          echo
          echo "============================================================"
          echo "END OF DIAGNOSTIC"
          echo "============================================================"

          exit 1
