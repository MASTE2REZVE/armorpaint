name: Build ArmorPaint Android

on:
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-24.04

    steps:
      # ============================================================
      # 1. CHECKOUT
      # ============================================================
      - name: Checkout ArmorPaint
        uses: actions/checkout@v4

      # ============================================================
      # 2. JAVA
      # ============================================================
      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      # ============================================================
      # 3. ANDROID SDK
      # ============================================================
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK components
        shell: bash
        run: |
          set -euxo pipefail

          yes | sdkmanager --licenses || true

          sdkmanager \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            "ndk;29.0.14206865" \
            "cmake;4.0.2"

      # ============================================================
      # 4. SHOW SOURCE TREE
      # ============================================================
      - name: Inspect ArmorPaint source
        shell: bash
        run: |
          set -e

          echo
          echo "========================================"
          echo "ARMORPAINT SOURCE"
          echo "========================================"

          echo
          echo "Top-level:"
          find . -maxdepth 2 -type f -print | sort | head -n 300

          echo
          echo "Android-related source files:"
          find base paint -type f \
            \( \
              -name "*.gradle" \
              -o -name "*.gradle.kts" \
              -o -name "settings.gradle" \
              -o -name "settings.gradle.kts" \
              -o -name "AndroidManifest.xml" \
              -o -name "gradlew" \
              -o -name "gradlew.bat" \
              -o -name "gradle-wrapper.jar" \
              -o -name "gradle-wrapper.properties" \
            \) \
            -print | sort

      # ============================================================
      # 5. FIX TEMPLATE PATH BUG
      # ============================================================
      - name: Fix ArmorPaint template paths
        shell: bash
        run: |
          set -euxo pipefail

          python3 <<'PY'
          from pathlib import Path

          path = Path("base/tools/make.js")

          if not path.exists():
              raise SystemExit("ERROR: base/tools/make.js not found")

          text = path.read_text()

          old = 'irondir + "/sources/backends/data/"'
          new = 'makedir + "/sources/backends/data/"'

          count = text.count(old)

          print(f"Found {count} incorrect template path occurrence(s).")

          if count > 0:
              text = text.replace(old, new)
              path.write_text(text)
              print("Template paths corrected.")
          else:
              print("No incorrect template paths found.")

          print()
          print("Relevant get_*_data functions:")
          lines = text.splitlines()

          for i, line in enumerate(lines):
              if "function get_binary_data" in line or "function get_text_data" in line:
                  start = max(0, i - 2)
                  end = min(len(lines), i + 12)

                  print()
                  for n in range(start, end):
                      print(f"{n + 1}: {lines[n]}")
          PY

      # ============================================================
      # 6. INSPECT ANDROID TEMPLATE
      # ============================================================
      - name: Inspect Android template
        shell: bash
        run: |
          set -e

          TEMPLATE="base/sources/backends/data/android"

          echo
          echo "========================================"
          echo "ANDROID TEMPLATE"
          echo "========================================"

          if [ ! -d "$TEMPLATE" ]; then
            echo "ERROR: Android template does not exist:"
            echo "$TEMPLATE"
            exit 1
          fi

          echo
          echo "Template directory:"
          find "$TEMPLATE" -maxdepth 5 -print | sort

          echo
          echo "Template file sizes:"
          find "$TEMPLATE" -type f -printf '%s bytes  %p\n' | sort -n

          echo
          echo "Gradle wrapper files:"
          ls -lah "$TEMPLATE/gradlew" \
                  "$TEMPLATE/gradlew.bat" \
                  "$TEMPLATE/gradle/wrapper/gradle-wrapper.jar" \
                  "$TEMPLATE/gradle/wrapper/gradle-wrapper.properties"

          echo
          echo "========================================"
          echo "TEMPLATE GRADLE FILE CONTENT"
          echo "========================================"

          for file in \
            "$TEMPLATE/settings.gradle" \
            "$TEMPLATE/settings.gradle.kts" \
            "$TEMPLATE/build.gradle" \
            "$TEMPLATE/build.gradle.kts" \
            "$TEMPLATE/gradle.properties" \
            "$TEMPLATE/gradle/wrapper/gradle-wrapper.properties"
          do
            if [ -f "$file" ]; then
              echo
              echo "----------------------------------------"
              echo "FILE: $file"
              echo "----------------------------------------"
              cat "$file"
            fi
          done

          echo
          echo "========================================"
          echo "TEMPLATE GRADLE WRAPPER HEAD"
          echo "========================================"

          if [ -f "$TEMPLATE/gradlew" ]; then
            head -n 20 "$TEMPLATE/gradlew"
          fi

      # ============================================================
      # 7. GENERATE ANDROID PROJECT
      # ============================================================
      - name: Generate Android project
        working-directory: paint
        shell: bash
        run: |
          set -euxo pipefail

          echo
          echo "========================================"
          echo "GENERATING ANDROID PROJECT"
          echo "========================================"

          ../base/make --target android

      # ============================================================
      # 8. CHECK GENERATED PROJECT
      # ============================================================
      - name: Inspect generated project
        working-directory: paint
        shell: bash
        run: |
          set -e

          PROJECT="build/ArmorPaint"

          echo
          echo "========================================"
          echo "GENERATED PROJECT"
          echo "========================================"

          if [ ! -d "$PROJECT" ]; then
            echo "ERROR: Generated project does not exist:"
            echo "$PROJECT"
            exit 1
          fi

          echo
          echo "Project root:"
          pwd
          echo

          echo "Project contents:"
          find "$PROJECT" -maxdepth 6 -print | sort

          echo
          echo "========================================"
          echo "GENERATED FILE SIZES"
          echo "========================================"

          find "$PROJECT" -type f -printf '%s bytes  %p\n' | sort -n

      # ============================================================
      # 9. REPAIR GRADLE WRAPPER
      # ============================================================
      - name: Repair generated Gradle wrapper
        working-directory: paint
        shell: bash
        run: |
          set -euxo pipefail

          PROJECT="build/ArmorPaint"
          TEMPLATE="../base/sources/backends/data/android"

          test -d "$PROJECT"
          test -d "$TEMPLATE"

          mkdir -p "$PROJECT/gradle/wrapper"

          cp "$TEMPLATE/gradlew" \
             "$PROJECT/gradlew"

          cp "$TEMPLATE/gradlew.bat" \
             "$PROJECT/gradlew.bat"

          cp "$TEMPLATE/gradle/wrapper/gradle-wrapper.jar" \
             "$PROJECT/gradle/wrapper/gradle-wrapper.jar"

          cp "$TEMPLATE/gradle/wrapper/gradle-wrapper.properties" \
             "$PROJECT/gradle/wrapper/gradle-wrapper.properties"

          chmod +x "$PROJECT/gradlew"

          echo
          echo "========================================"
          echo "GENERATED GRADLE WRAPPER"
          echo "========================================"

          ls -lah \
            "$PROJECT/gradlew" \
            "$PROJECT/gradlew.bat" \
            "$PROJECT/gradle/wrapper/gradle-wrapper.jar" \
            "$PROJECT/gradle/wrapper/gradle-wrapper.properties"

          echo
          echo "gradlew first 20 lines:"
          head -n 20 "$PROJECT/gradlew"

      # ============================================================
      # 10. INSPECT ALL GRADLE FILES
      # ============================================================
      - name: Inspect generated Gradle files
        working-directory: paint/build/ArmorPaint
        shell: bash
        run: |
          set -e

          echo
          echo "========================================"
          echo "ALL GENERATED GRADLE FILES"
          echo "========================================"

          find . -type f \
            \( \
              -name "*.gradle" \
              -o -name "*.gradle.kts" \
              -o -name "settings.gradle" \
              -o -name "settings.gradle.kts" \
              -o -name "gradle.properties" \
            \) \
            -print | sort

          echo
          echo "========================================"
          echo "GRADLE FILE CONTENT"
          echo "========================================"

          while IFS= read -r file; do
            echo
            echo "----------------------------------------"
            echo "FILE: $file"
            echo "----------------------------------------"
            cat "$file"
          done < <(
            find . -type f \
              \( \
                -name "*.gradle" \
                -o -name "*.gradle.kts" \
                -o -name "settings.gradle" \
                -o -name "settings.gradle.kts" \
                -o -name "gradle.properties" \
              \) \
              -print | sort
          )

      # ============================================================
      # 11. INSPECT ANDROID MANIFESTS
      # ============================================================
      - name: Inspect Android manifests
        working-directory: paint/build/ArmorPaint
        shell: bash
        run: |
          set -e

          echo
          echo "========================================"
          echo "ANDROID MANIFEST FILES"
          echo "========================================"

          find . -type f \
            -name "AndroidManifest.xml" \
            -print | sort

          while IFS= read -r file; do
            echo
            echo "----------------------------------------"
            echo "FILE: $file"
            echo "----------------------------------------"
            cat "$file"
          done < <(
            find . -type f \
              -name "AndroidManifest.xml" \
              -print | sort
          )

      # ============================================================
      # 12. INSPECT GENERATED PROJECT TREE
      # ============================================================
      - name: Inspect generated directory tree
        working-directory: paint/build/ArmorPaint
        shell: bash
        run: |
          set -e

          echo
          echo "========================================"
          echo "GENERATED DIRECTORY TREE"
          echo "========================================"

          find . -maxdepth 8 -type d -print | sort

          echo
          echo "========================================"
          echo "IMPORTANT FILES"
          echo "========================================"

          find . -maxdepth 8 -type f \
            \( \
              -name "build.gradle" \
              -o -name "build.gradle.kts" \
              -o -name "settings.gradle" \
              -o -name "settings.gradle.kts" \
              -o -name "AndroidManifest.xml" \
              -o -name "*.aar" \
              -o -name "*.jar" \
              -o -name "*.so" \
              -o -name "*.cpp" \
              -o -name "*.kt" \
              -o -name "*.java" \
            \) \
            -print | sort

      # ============================================================
      # 13. GRADLE PROJECT INFORMATION
      # ============================================================
      - name: Inspect Gradle project
        working-directory: paint/build/ArmorPaint
        shell: bash
        run: |
          set -euxo pipefail

          chmod +x gradlew

          echo
          echo "========================================"
          echo "GRADLE VERSION"
          echo "========================================"

          ./gradlew --version

          echo
          echo "========================================"
          echo "GRADLE PROJECTS"
          echo "========================================"

          ./gradlew projects --no-daemon

          echo
          echo "========================================"
          echo "ALL GRADLE TASKS"
          echo "========================================"

          ./gradlew tasks --all --no-daemon

      # ============================================================
      # 14. INSPECT GRADLE PROPERTIES
      # ============================================================
      - name: Inspect Gradle properties
        working-directory: paint/build/ArmorPaint
        shell: bash
        run: |
          set -e

          echo
          echo "========================================"
          echo "GRADLE PROPERTIES"
          echo "========================================"

          ./gradlew properties --no-daemon

      # ============================================================
      # 15. INSPECT MAKE.JS ANDROID SECTION
      # ============================================================
      - name: Inspect ArmorPaint Android generator
        shell: bash
        run: |
          set -e

          echo
          echo "========================================"
          echo "ANDROID GENERATOR CODE"
          echo "========================================"

          python3 <<'PY'
          from pathlib import Path

          path = Path("base/tools/make.js")
          text = path.read_text()
          lines = text.splitlines()

          keywords = [
              "android",
              "gradle",
              "gradlew",
              "settings.gradle",
              "build.gradle",
              "AndroidManifest",
              "ArmorPaint"
          ]

          for i, line in enumerate(lines):
              lower = line.lower()

              if any(keyword.lower() in lower for keyword in keywords):
                  start = max(0, i - 3)
                  end = min(len(lines), i + 4)

                  print()
                  print(f"--- around line {i + 1} ---")

                  for n in range(start, end):
                      print(f"{n + 1}: {lines[n]}")
          PY

      # ============================================================
      # 16. FINAL DIAGNOSTIC SUMMARY
      # ============================================================
      - name: Stop before APK build
        shell: bash
        run: |
          echo
          echo "========================================"
          echo "BUILD #21 DIAGNOSTIC COMPLETE"
          echo "========================================"
          echo
          echo "NO APK BUILD WAS ATTEMPTED."
          echo
          echo "The workflow collected:"
          echo "  - Android template structure"
          echo "  - Android template Gradle files"
          echo "  - Generated project structure"
          echo "  - Generated Gradle files"
          echo "  - AndroidManifest files"
          echo "  - Gradle version"
          echo "  - Gradle projects"
          echo "  - All Gradle tasks"
          echo "  - Gradle properties"
          echo "  - ArmorPaint Android generator code"
          echo
          echo "The workflow intentionally stops here."
          echo

          exit 1
