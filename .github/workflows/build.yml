name: Build ArmorPaint Android

on:
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout ArmorPaint
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK components
        run: |
          sdkmanager "platform-tools" \
                     "platforms;android-36" \
                     "build-tools;36.0.0" \
                     "ndk;29.0.14206865" \
                     "cmake;4.0.2"

      - name: Generate Android project
        working-directory: paint
        run: |
          ../base/make --target android

      - name: Make Gradle executable
        working-directory: paint/build/ArmorPaint
        run: chmod +x gradlew

      - name: Build APK
        working-directory: paint/build/ArmorPaint
        run: ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ArmorPaint-Android-APK
          path: paint/build/ArmorPaint/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
