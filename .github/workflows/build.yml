name: Build ArmorPaint Android

on:
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-24.04

    steps:

      - name: Checkout ArmorPaint
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK components
        run: |
          yes | sdkmanager --licenses || true

          sdkmanager \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            "ndk;29.0.14206865" \
            "cmake;4.0.2"

      - name: Fix ArmorPaint template paths
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path

          path = Path("base/tools/make.js")
          text = path.read_text()

          old = 'irondir + "/sources/backends/data/"'
          new = 'makedir + "/sources/backends/data/"'

          count = text.count(old)

          print(f"Found {count} incorrect template path(s).")

          if count > 0:
              text = text.replace(old, new)
              path.write_text(text)
              print("Template paths corrected.")
          else:
              print("No incorrect template paths found.")
          PY

      - name: Verify Android template
        run: |
          set -e

          echo "Checking Android template..."

          test -d "base/sources/backends/data/android"

          test -s \
            "base/sources/backends/data/android/gradlew"

          test -s \
            "base/sources/backends/data/android/gradlew.bat"

          test -s \
            "base/sources/backends/data/android/gradle/wrapper/gradle-wrapper.jar"

          test -s \
            "base/sources/backends/data/android/gradle/wrapper/gradle-wrapper.properties"

          echo
          echo "Android template:"
          ls -lah "base/sources/backends/data/android"

          echo
          echo "Wrapper:"
          ls -lah "base/sources/backends/data/android/gradle/wrapper"

      - name: Generate Android project
        working-directory: paint
        shell: bash
        run: |
          set -euxo pipefail

          ../base/make --target android

      - name: Repair generated Gradle wrapper
        working-directory: paint
        shell: bash
        run: |
          set -euxo pipefail

          PROJECT="build/ArmorPaint"
          TEMPLATE="../base/sources/backends/data/android"

          test -d "$PROJECT"
          test -d "$TEMPLATE"

          mkdir -p "$PROJECT/gradle/wrapper"

          cp \
            "$TEMPLATE/gradlew" \
            "$PROJECT/gradlew"

          cp \
            "$TEMPLATE/gradlew.bat" \
            "$PROJECT/gradlew.bat"

          cp \
            "$TEMPLATE/gradle/wrapper/gradle-wrapper.jar" \
            "$PROJECT/gradle/wrapper/gradle-wrapper.jar"

          cp \
            "$TEMPLATE/gradle/wrapper/gradle-wrapper.properties" \
            "$PROJECT/gradle/wrapper/gradle-wrapper.properties"

          chmod +x "$PROJECT/gradlew"

          echo
          echo "Generated project files:"
          find "$PROJECT" \
            -maxdepth 3 \
            -type f \
            -print | sort

          echo
          echo "Gradle wrapper:"
          ls -lah "$PROJECT/gradle/wrapper"

      - name: Inspect Gradle project
        working-directory: paint/build/ArmorPaint
        shell: bash
        run: |
          set -euxo pipefail

          chmod +x gradlew

          echo
          echo "========================================"
          echo "GRADLE VERSION"
          echo "========================================"

          ./gradlew --version

          echo
          echo "========================================"
          echo "GRADLE PROJECTS"
          echo "========================================"

          ./gradlew projects \
            --no-daemon

          echo
          echo "========================================"
          echo "ALL GRADLE TASKS"
          echo "========================================"

          ./gradlew tasks \
            --all \
            --no-daemon

      - name: Inspect generated Android files
        working-directory: paint/build/ArmorPaint
        shell: bash
        run: |
          echo
          echo "========================================"
          echo "BUILD FILES"
          echo "========================================"

          find . \
            -maxdepth 3 \
            \( \
              -name "build.gradle" \
              -o -name "build.gradle.kts" \
              -o -name "settings.gradle" \
              -o -name "settings.gradle.kts" \
              -o -name "AndroidManifest.xml" \
              -o -name "gradle.properties" \
            \) \
            -print | sort

          echo
          echo "========================================"
          echo "DIRECTORY TREE"
          echo "========================================"

          find . \
            -maxdepth 3 \
            -type d \
            -print | sort

      - name: Stop before build
        shell: bash
        run: |
          echo
          echo "========================================"
          echo "DIAGNOSTIC COMPLETE"
          echo "========================================"
          echo
          echo "The workflow intentionally stops here."
          echo "We need the Gradle project/task information."
          echo "No APK build was attempted."
          exit 1
