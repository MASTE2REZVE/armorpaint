name: Build ArmorPaint Android

on:
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-24.04

    steps:

      # ============================================================
      # 1. CHECKOUT
      # ============================================================
      - name: Checkout ArmorPaint
        uses: actions/checkout@v4

      # ============================================================
      # 2. JAVA
      # ============================================================
      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      # ============================================================
      # 3. ANDROID SDK
      # ============================================================
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK
        shell: bash
        run: |
          set -euxo pipefail

          yes | sdkmanager --licenses || true

          sdkmanager \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            "ndk;29.0.14206865" \
            "cmake;4.0.2"

      # ============================================================
      # 4. FIX TEMPLATE PATHS
      # ============================================================
      - name: Fix ArmorPaint template paths
        shell: bash
        run: |
          set -euxo pipefail

          python3 <<'PY'
          from pathlib import Path

          path = Path("base/tools/make.js")
          text = path.read_text()

          old = 'irondir + "/sources/backends/data/"'
          new = 'makedir + "/sources/backends/data/"'

          count = text.count(old)

          print(f"Incorrect path occurrences: {count}")

          if count:
              text = text.replace(old, new)
              path.write_text(text)
              print("Paths fixed.")
          else:
              print("No path replacement necessary.")
          PY

      # ============================================================
      # 5. INSPECT THE ACTUAL ANDROID TEMPLATE
      # ============================================================
      - name: Inspect Android template files
        shell: bash
        run: |
          set -e

          TEMPLATE="base/sources/backends/data/android"

          echo
          echo "========================================"
          echo "ANDROID TEMPLATE FILES"
          echo "========================================"

          find "$TEMPLATE" -maxdepth 4 -type f -print | sort

          echo
          echo "========================================"
          echo "TEMPLATE FILE SIZES"
          echo "========================================"

          find "$TEMPLATE" -maxdepth 4 -type f \
            -printf '%s bytes  %p\n' | sort -n

          echo
          echo "========================================"
          echo "TEMPLATE build.gradle.kts"
          echo "========================================"

          if [ -f "$TEMPLATE/build.gradle.kts" ]; then
            cat "$TEMPLATE/build.gradle.kts"
          else
            echo "MISSING"
          fi

          echo
          echo "========================================"
          echo "TEMPLATE settings.gradle.kts"
          echo "========================================"

          if [ -f "$TEMPLATE/settings.gradle.kts" ]; then
            cat "$TEMPLATE/settings.gradle.kts"
          else
            echo "MISSING"
          fi

          echo
          echo "========================================"
          echo "TEMPLATE gradle.properties"
          echo "========================================"

          if [ -f "$TEMPLATE/gradle.properties" ]; then
            cat "$TEMPLATE/gradle.properties"
          else
            echo "MISSING"
          fi

      # ============================================================
      # 6. GENERATE ANDROID PROJECT
      # ============================================================
      - name: Generate Android project
        working-directory: paint
        shell: bash
        run: |
          set -euxo pipefail

          ../base/make --target android

      # ============================================================
      # 7. REPAIR WRAPPER
      # ============================================================
      - name: Repair Gradle wrapper
        working-directory: paint
        shell: bash
        run: |
          set -euxo pipefail

          PROJECT="build/ArmorPaint"
          TEMPLATE="../base/sources/backends/data/android"

          mkdir -p "$PROJECT/gradle/wrapper"

          cp "$TEMPLATE/gradlew" \
             "$PROJECT/gradlew"

          cp "$TEMPLATE/gradlew.bat" \
             "$PROJECT/gradlew.bat"

          cp "$TEMPLATE/gradle/wrapper/gradle-wrapper.jar" \
             "$PROJECT/gradle/wrapper/gradle-wrapper.jar"

          cp "$TEMPLATE/gradle/wrapper/gradle-wrapper.properties" \
             "$PROJECT/gradle/wrapper/gradle-wrapper.properties"

          chmod +x "$PROJECT/gradlew"

      # ============================================================
      # 8. PRINT EXACT GENERATED GRADLE FILES
      # ============================================================
      - name: Inspect generated Gradle files
        working-directory: paint/build/ArmorPaint
        shell: bash
        run: |
          set -e

          echo
          echo "############################################################"
          echo "# GENERATED PROJECT ROOT"
          echo "############################################################"

          pwd

          echo
          echo "############################################################"
          echo "# COMPLETE FILE LIST"
          echo "############################################################"

          find . -maxdepth 6 -type f -print | sort

          echo
          echo "############################################################"
          echo "# FILE SIZES"
          echo "############################################################"

          find . -maxdepth 6 -type f \
            -printf '%s bytes  %p\n' | sort -n

          echo
          echo "############################################################"
          echo "# build.gradle.kts"
          echo "############################################################"

          if [ -f build.gradle.kts ]; then
            wc -c build.gradle.kts
            cat build.gradle.kts
          else
            echo "MISSING: build.gradle.kts"
          fi

          echo
          echo "############################################################"
          echo "# settings.gradle.kts"
          echo "############################################################"

          if [ -f settings.gradle.kts ]; then
            wc -c settings.gradle.kts
            cat settings.gradle.kts
          else
            echo "MISSING: settings.gradle.kts"
          fi

          echo
          echo "############################################################"
          echo "# settings.gradle"
          echo "############################################################"

          if [ -f settings.gradle ]; then
            wc -c settings.gradle
            cat settings.gradle
          else
            echo "MISSING: settings.gradle"
          fi

          echo
          echo "############################################################"
          echo "# gradle.properties"
          echo "############################################################"

          if [ -f gradle.properties ]; then
            wc -c gradle.properties
            cat gradle.properties
          else
            echo "MISSING: gradle.properties"
          fi

          echo
          echo "############################################################"
          echo "# build.gradle"
          echo "############################################################"

          if [ -f build.gradle ]; then
            wc -c build.gradle
            cat build.gradle
          else
            echo "MISSING: build.gradle"
          fi

          echo
          echo "############################################################"
          echo "# GRADLE WRAPPER PROPERTIES"
          echo "############################################################"

          if [ -f gradle/wrapper/gradle-wrapper.properties ]; then
            cat gradle/wrapper/gradle-wrapper.properties
          else
            echo "MISSING"
          fi

      # ============================================================
      # 9. SEARCH FOR ANDROID BUILD CONFIGURATION
      # ============================================================
      - name: Search generated project for Android configuration
        working-directory: paint/build/ArmorPaint
        shell: bash
        run: |
          set -e

          echo
          echo "############################################################"
          echo "# ANDROID CONFIGURATION SEARCH"
          echo "############################################################"

          echo
          echo "Android plugin references:"
          grep -Rni \
            -E \
            "com.android.application|com.android.library|android \{|compileSdk|minSdk|targetSdk|namespace|applicationId" \
            . \
            --exclude-dir=.gradle \
            --exclude=gradle-wrapper.jar \
            || true

          echo
          echo "Kotlin references:"
          grep -Rni \
            -E \
            "kotlin|org.jetbrains.kotlin" \
            . \
            --exclude-dir=.gradle \
            --exclude=gradle-wrapper.jar \
            || true

      # ============================================================
      # 10. GRADLE PROJECT/TASK CHECK
      # ============================================================
      - name: Check Gradle project
        working-directory: paint/build/ArmorPaint
        shell: bash
        run: |
          set -e

          chmod +x gradlew

          echo
          echo "############################################################"
          echo "# GRADLE PROJECTS"
          echo "############################################################"

          ./gradlew projects --no-daemon

          echo
          echo "############################################################"
          echo "# ALL TASKS"
          echo "############################################################"

          ./gradlew tasks --all --no-daemon

      # ============================================================
      # 11. STOP
      # ============================================================
      - name: Stop before APK build
        shell: bash
        run: |
          echo
          echo "############################################################"
          echo "# BUILD #22 COMPLETE"
          echo "############################################################"
          echo
          echo "NO APK BUILD WAS ATTEMPTED."
          echo
          echo "We now have the exact generated Gradle configuration."
          echo

          exit 1
