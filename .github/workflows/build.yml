name: Build ArmorPaint Android

on:
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout ArmorPaint
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK components
        run: |
          set -euxo pipefail

          sdkmanager --install \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            "ndk;29.0.14206865" \
            "cmake;4.0.2"

          yes | sdkmanager --licenses || true

      - name: Locate ArmorPaint build files
        run: |
          set -euxo pipefail

          echo "============================================================"
          echo "REPOSITORY ROOT"
          echo "============================================================"

          pwd
          ls -la

          echo
          echo "============================================================"
          echo "LOCATING make.js"
          echo "============================================================"

          find . -type f -name "make.js" -print

          echo
          echo "============================================================"
          echo "LOCATING Android template"
          echo "============================================================"

          find . -type d \
            -path "*/sources/backends/data/android" \
            -print

          echo
          echo "============================================================"
          echo "LOCATING AndroidExporter"
          echo "============================================================"

          grep -Rni \
            "class AndroidExporter" \
            . \
            --include="make.js" \
            2>/dev/null || true

          echo
          echo "============================================================"
          echo "TOP-LEVEL DIRECTORIES"
          echo "============================================================"

          find . -maxdepth 2 -type d -print | sort

      - name: Generate Android project
        working-directory: paint
        run: |
          set -euxo pipefail

          echo "============================================================"
          echo "GENERATING ANDROID PROJECT"
          echo "============================================================"

          ../base/make --target android

          echo
          echo "Generation finished."

      - name: Inspect generated Android project
        working-directory: paint/build/ArmorPaint
        run: |
          set +e

          echo
          echo "============================================================"
          echo "GENERATED ANDROID PROJECT"
          echo "============================================================"

          pwd

          echo
          echo "============================================================"
          echo "ROOT FILES"
          echo "============================================================"

          find . -maxdepth 2 -type f \
            -printf '%p (%s bytes)\n' \
            | sort

          echo
          echo "============================================================"
          echo "ROOT FOLDERS"
          echo "============================================================"

          find . -maxdepth 2 -type d \
            -print \
            | sort

          echo
          echo "============================================================"
          echo "build.gradle.kts"
          echo "============================================================"

          if [ -f build.gradle.kts ]; then
            echo "SIZE:"
            wc -c build.gradle.kts
            echo
            echo "CONTENT:"
            cat build.gradle.kts
          else
            echo "MISSING"
          fi

          echo
          echo "============================================================"
          echo "settings.gradle.kts"
          echo "============================================================"

          if [ -f settings.gradle.kts ]; then
            echo "SIZE:"
            wc -c settings.gradle.kts
            echo
            echo "CONTENT:"
            cat settings.gradle.kts
          else
            echo "MISSING"
          fi

          echo
          echo "============================================================"
          echo "settings.gradle"
          echo "============================================================"

          if [ -f settings.gradle ]; then
            echo "SIZE:"
            wc -c settings.gradle
            echo
            echo "CONTENT:"
            cat settings.gradle
          else
            echo "MISSING"
          fi

          echo
          echo "============================================================"
          echo "gradle.properties"
          echo "============================================================"

          if [ -f gradle.properties ]; then
            echo "SIZE:"
            wc -c gradle.properties
            echo
            echo "CONTENT:"
            cat gradle.properties
          else
            echo "MISSING"
          fi

          echo
          echo "============================================================"
          echo "ALL GRADLE FILES"
          echo "============================================================"

          find . -type f \( \
            -name "*.gradle" \
            -o -name "*.gradle.kts" \
          \) \
            -printf '%p (%s bytes)\n' \
            | sort

          echo
          echo "============================================================"
          echo "ANDROID MANIFESTS"
          echo "============================================================"

          find . -type f \
            -name "AndroidManifest.xml" \
            -print

          echo
          echo "============================================================"
          echo "END OF DIAGNOSTIC"
          echo "============================================================"

          exit 1
