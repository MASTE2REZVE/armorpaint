name: Build ArmorPaint Android

on:
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-24.04

    steps:

      # ==================================================
      # 1. Checkout ArmorPaint
      # ==================================================
      - name: Checkout ArmorPaint
        uses: actions/checkout@v4

      # ==================================================
      # 2. Java 21
      # ==================================================
      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      # ==================================================
      # 3. Android SDK
      # ==================================================
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      # ==================================================
      # 4. Install Android SDK components
      # ==================================================
      - name: Install Android SDK components
        run: |
          yes | sdkmanager --licenses || true

          sdkmanager \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            "ndk;29.0.14206865" \
            "cmake;4.0.2"

      # ==================================================
      # 5. Fix ArmorPaint template paths
      # ==================================================
      - name: Fix ArmorPaint template paths
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path

          path = Path("base/tools/make.js")
          text = path.read_text()

          old = 'irondir + "/sources/backends/data/"'
          new = 'makedir + "/sources/backends/data/"'

          count = text.count(old)

          print(f"Found {count} template path(s) using irondir.")

          if count > 0:
              text = text.replace(old, new)
              path.write_text(text)
              print("Template paths corrected.")
          else:
              print("No incorrect template paths found.")
          PY

      # ==================================================
      # 6. Verify Android template
      # ==================================================
      - name: Verify Android template
        run: |
          set -e

          echo "Checking Android template..."

          test -d "base/sources/backends/data/android"

          test -s \
            "base/sources/backends/data/android/gradlew"

          test -s \
            "base/sources/backends/data/android/gradlew.bat"

          test -s \
            "base/sources/backends/data/android/gradle/wrapper/gradle-wrapper.jar"

          test -s \
            "base/sources/backends/data/android/gradle/wrapper/gradle-wrapper.properties"

          echo
          echo "Android template is valid."

          echo
          echo "Gradle wrapper files:"
          ls -lah \
            "base/sources/backends/data/android/gradle/wrapper"

      # ==================================================
      # 7. Generate Android project
      # ==================================================
      - name: Generate Android project
        working-directory: paint
        shell: bash
        run: |
          set -euxo pipefail

          echo "Current directory:"
          pwd

          echo
          echo "Generating ArmorPaint Android project..."

          ../base/make --target android

          echo
          echo "ArmorPaint Android generation completed."

      # ==================================================
      # 8. Repair Android Gradle wrapper
      # ==================================================
      - name: Repair generated Gradle wrapper
        working-directory: paint
        shell: bash
        run: |
          set -euxo pipefail

          PROJECT="build/ArmorPaint"
          TEMPLATE="../base/sources/backends/data/android"

          echo "Project: $PROJECT"
          echo "Template: $TEMPLATE"

          test -d "$PROJECT"
          test -d "$TEMPLATE"

          mkdir -p "$PROJECT/gradle/wrapper"

          echo
          echo "Copying gradlew..."

          cp \
            "$TEMPLATE/gradlew" \
            "$PROJECT/gradlew"

          echo
          echo "Copying gradlew.bat..."

          cp \
            "$TEMPLATE/gradlew.bat" \
            "$PROJECT/gradlew.bat"

          echo
          echo "Copying Gradle wrapper JAR..."

          cp \
            "$TEMPLATE/gradle/wrapper/gradle-wrapper.jar" \
            "$PROJECT/gradle/wrapper/gradle-wrapper.jar"

          echo
          echo "Copying Gradle wrapper properties..."

          cp \
            "$TEMPLATE/gradle/wrapper/gradle-wrapper.properties" \
            "$PROJECT/gradle/wrapper/gradle-wrapper.properties"

          chmod +x "$PROJECT/gradlew"

          echo
          echo "First lines of gradlew:"
          head -n 5 "$PROJECT/gradlew"

          echo
          echo "Gradle wrapper directory:"
          ls -lah "$PROJECT/gradle/wrapper"

          echo
          echo "Checking files..."

          test -s "$PROJECT/gradlew"
          test -s "$PROJECT/gradlew.bat"
          test -s "$PROJECT/gradle/wrapper/gradle-wrapper.jar"
          test -s "$PROJECT/gradle/wrapper/gradle-wrapper.properties"

          echo
          echo "Gradle wrapper repaired successfully."

      # ==================================================
      # 9. Verify generated Android project
      # ==================================================
      - name: Verify generated Android project
        working-directory: paint
        shell: bash
        run: |
          set -euxo pipefail

          PROJECT="build/ArmorPaint"

          echo "Checking generated Android project..."

          test -d "$PROJECT"

          test -s "$PROJECT/gradlew"

          test -s "$PROJECT/gradlew.bat"

          test -s \
            "$PROJECT/gradle/wrapper/gradle-wrapper.jar"

          test -s \
            "$PROJECT/gradle/wrapper/gradle-wrapper.properties"

          echo
          echo "Generated Android project is ready."

          echo
          echo "Gradle wrapper:"
          ls -lah "$PROJECT/gradle/wrapper"

      # ==================================================
      # 10. Make Gradle executable
      # ==================================================
      - name: Make Gradle executable
        working-directory: paint/build/ArmorPaint
        run: |
          chmod +x gradlew

      # ==================================================
      # 11. Check Gradle
      # ==================================================
      - name: Check Gradle
        working-directory: paint/build/ArmorPaint
        shell: bash
        run: |
          ./gradlew --version

      # ==================================================
      # 12. Build APK
      # ==================================================
      - name: Build APK
        working-directory: paint/build/ArmorPaint
        shell: bash
        run: |
          ./gradlew assembleDebug \
            --no-daemon \
            --stacktrace

      # ==================================================
      # 13. Verify APK
      # ==================================================
      - name: Verify APK
        shell: bash
        run: |
          set -e

          echo "Searching for APK..."

          find \
            paint/build/ArmorPaint/app/build/outputs \
            -type f \
            -name "*.apk" \
            -print

          APK="$(find \
            paint/build/ArmorPaint/app/build/outputs \
            -type f \
            -name "*.apk" \
            -print -quit)"

          if [ -z "$APK" ]; then
            echo "ERROR: APK was not generated."
            exit 1
          fi

          echo
          echo "APK successfully generated:"
          echo "$APK"

      # ==================================================
      # 14. Upload APK
      # ==================================================
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ArmorPaint-Android-APK
          path: paint/build/ArmorPaint/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
