name: Build ArmorPaint Android

on:
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-24.04

    steps:

      - name: Checkout ArmorPaint
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK
        run: |
          yes | sdkmanager --licenses || true

          sdkmanager \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            "ndk;29.0.14206865" \
            "cmake;4.0.2"

      - name: Fix ArmorPaint template paths
        run: |
          python3 <<'PY'
          from pathlib import Path

          p = Path("base/tools/make.js")
          s = p.read_text()

          old = 'irondir + "/sources/backends/data/"'
          new = 'makedir + "/sources/backends/data/"'

          count = s.count(old)

          print(f"Found {count} template paths using irondir.")

          if count > 0:
              s = s.replace(old, new)
              p.write_text(s)
              print("Template paths corrected.")
          else:
              print("No irondir template paths needed changing.")
          PY

      - name: Verify ArmorPaint source
        run: |
          echo "Android template:"
          find base/sources/backends/data/android \
            -maxdepth 4 \
            -type f \
            -print | sort

          echo
          echo "Checking source Gradle wrapper..."

          test -s \
            base/sources/backends/data/android/gradlew

          test -s \
            base/sources/backends/data/android/gradle/wrapper/gradle-wrapper.jar

          test -s \
            base/sources/backends/data/android/gradle/wrapper/gradle-wrapper.properties

          echo "Source Gradle wrapper is present."

      - name: Generate Android project
        working-directory: paint
        run: |
          set -euxo pipefail

          ../base/make --target android

          echo "Generator completed."

      - name: Repair generated Gradle wrapper
        working-directory: paint
        run: |
          set -euxo pipefail

          PROJECT="build/ArmorPaint"
          TEMPLATE="../../base/sources/backends/data/android"

          echo "Project: $PROJECT"
          echo "Template: $TEMPLATE"

          test -d "$PROJECT"

          mkdir -p "$PROJECT/gradle/wrapper"

          cp "$TEMPLATE/gradle/wrapper/gradle-wrapper.jar" \
             "$PROJECT/gradle/wrapper/gradle-wrapper.jar"

          cp "$TEMPLATE/gradle/wrapper/gradle-wrapper.properties" \
             "$PROJECT/gradle/wrapper/gradle-wrapper.properties"

          echo "Gradle wrapper repaired."

          ls -lah "$PROJECT/gradle/wrapper"

      - name: Verify generated project
        working-directory: paint
        run: |
          set -euxo pipefail

          PROJECT="build/ArmorPaint"

          test -f "$PROJECT/gradlew"
          test -s "$PROJECT/gradle/wrapper/gradle-wrapper.jar"
          test -s "$PROJECT/gradle/wrapper/gradle-wrapper.properties"

          echo
          echo "Generated Android project is ready."

          echo
          echo "Gradle wrapper:"
          ls -lah "$PROJECT/gradle/wrapper"

      - name: Make Gradle executable
        working-directory: paint/build/ArmorPaint
        run: |
          chmod +x gradlew

      - name: Check Gradle
        working-directory: paint/build/ArmorPaint
        run: |
          ./gradlew --version

      - name: Build APK
        working-directory: paint/build/ArmorPaint
        run: |
          ./gradlew assembleDebug \
            --no-daemon \
            --stacktrace

      - name: Find APK
        run: |
          echo "Searching for APK..."

          find paint/build/ArmorPaint/app/build/outputs \
            -type f \
            -name "*.apk" \
            -print

          APK="$(find paint/build/ArmorPaint/app/build/outputs \
            -type f \
            -name "*.apk" \
            -print -quit)"

          if [ -z "$APK" ]; then
            echo "ERROR: APK was not generated."
            exit 1
          fi

          echo
          echo "APK generated successfully:"
          echo "$APK"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ArmorPaint-Android-APK
          path: paint/build/ArmorPaint/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
