name: Build ArmorPaint Android

on:
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout ArmorPaint
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK components
        run: |
          yes | sdkmanager --licenses || true

          sdkmanager \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            "ndk;29.0.14206865" \
            "cmake;4.0.2"

      - name: Fix ArmorPaint template paths
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path("base/tools/make.js")
          s = p.read_text()

          old = 'return fs_readfile(irondir + "/sources/backends/data/" + p);'
          new = 'return fs_readfile(makedir + "/sources/backends/data/" + p);'

          count = s.count(old)

          print(f"Found {count} incorrect template path(s).")

          if count == 0:
              raise SystemExit("ERROR: Expected template path was not found.")

          s = s.replace(old, new)

          p.write_text(s)

          print("Both template readers now use makedir.")
          PY

      - name: Verify Android template
        run: |
          echo "Checking ArmorPaint Android template..."

          test -d base/sources/backends/data/android
          test -d base/sources/backends/data/android/gradle/wrapper

          test -s base/sources/backends/data/android/gradlew
          test -s base/sources/backends/data/android/gradle/wrapper/gradle-wrapper.jar
          test -s base/sources/backends/data/android/gradle/wrapper/gradle-wrapper.properties

          echo "Android template looks valid."

          echo "Template contents:"
          find base/sources/backends/data/android -maxdepth 3 -type f | sort

      - name: Generate Android project
        working-directory: paint
        run: |
          ../base/make --target android

      - name: Verify generated Android project
        working-directory: paint
        run: |
          echo "Checking generated project..."

          test -d build/ArmorPaint
          test -f build/ArmorPaint/gradlew

          echo "Generated Gradle wrapper:"
          find build/ArmorPaint/gradle -maxdepth 3 -type f -print

          test -s build/ArmorPaint/gradle/wrapper/gradle-wrapper.jar
          test -s build/ArmorPaint/gradle/wrapper/gradle-wrapper.properties

          echo "Generated Gradle wrapper is valid."

      - name: Make Gradle executable
        working-directory: paint/build/ArmorPaint
        run: |
          chmod +x gradlew

      - name: Check Gradle
        working-directory: paint/build/ArmorPaint
        run: |
          ./gradlew --version

      - name: Build APK
        working-directory: paint/build/ArmorPaint
        run: |
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Find APK
        run: |
          echo "APK files:"
          find paint/build/ArmorPaint/app/build/outputs -type f -name "*.apk" -print

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ArmorPaint-Android-APK
          path: paint/build/ArmorPaint/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
